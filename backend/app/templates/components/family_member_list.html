<div class="family-section" id="family-members-{{ contact.id }}">
    <div class="section-header">
        <h3>Family Members</h3>
        <button class="btn-secondary btn-sm" hx-get="/ui/contacts/{{ contact.id }}/family-members/new"
            hx-target="#family-form-container" hx-swap="innerHTML">
            Add Family Member
        </button>
    </div>

    <div id="family-form-container"></div>

    {% if family_members %}
    <ul class="family-list" id="family-list-{{ contact.id }}">
        {% for member in family_members %}
        {% include 'components/family_member_item.html' %}
        {% endfor %}
    </ul>
    {% else %}
    <p class="empty-state">No family members added yet.</p>
    {% endif %}
</div>
