<li class="family-item" id="family-member-{{ member.id }}">
    <div class="family-member-content">
        <a href="/contacts/{{ member.family_contact_id }}" class="family-name">
            {{ member.first_name }} {{ member.last_name }}
        </a>
        <span class="family-relationship">({{ member.relationship }})</span>
    </div>
    <div class="family-actions">
        <button class="btn-icon" title="Edit relationship" hx-get="/ui/family-members/{{ member.id }}/edit"
            hx-target="#family-member-{{ member.id }}" hx-swap="outerHTML">
            ✏️
        </button>
        <button class="btn-icon" title="Remove relationship" hx-delete="/ui/family-members/{{ member.id }}"
            hx-target="#family-member-{{ member.id }}" hx-swap="outerHTML"
            hx-confirm="Remove this family relationship?">
            🗑️
        </button>
    </div>
</li>
