<li class="family-item" id="family-member-{{ member.id }}">
    <div class="family-member-content">
        <a href="/contacts/{{ member.family_contact_id }}" class="family-name">
            {{ member.first_name }}{% if member.last_name %} {{ member.last_name }}{% endif %}
        </a>
        <span class="family-relationship">({{ member.relationship }})</span>
    </div>
    <div class="family-actions">
        <button class="btn-icon" hx-get="/ui/family-members/{{ member.id }}/edit"
            hx-target="#family-member-{{ member.id }}" hx-swap="outerHTML" title="Edit relationship">[edit]</button>
        <button class="btn-icon" hx-delete="/ui/family-members/{{ member.id }}"
            hx-target="#family-member-{{ member.id }}" hx-swap="outerHTML" hx-confirm="Remove this family relationship?"
            title="Remove relationship">[delete]</button>
    </div>
</li>
