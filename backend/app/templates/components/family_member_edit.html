<li class="family-item family-item-edit" id="family-member-{{ family_member.id }}">
    <form hx-patch="/ui/family-members/{{ family_member.id }}" hx-target="#family-member-{{ family_member.id }}"
        hx-swap="outerHTML">
        <div class="family-edit-content">
            <span class="family-name">{{ family_member.first_name }}{% if family_member.last_name %} {{
                family_member.last_name }}{% endif %}</span>
            <div class="form-group-inline">
                <label for="relationship-{{ family_member.id }}">Relationship:</label>
                <select id="relationship-{{ family_member.id }}" name="relationship" required>
                    {% for rel in common_relationships %}
                    <option value="{{ rel }}" {% if rel==family_member.relationship %}selected{% endif %}>
                        {{ rel }}
                    </option>
                    {% endfor %}
                    {% if family_member.relationship not in common_relationships %}
                    <option value="{{ family_member.relationship }}" selected>{{ family_member.relationship }}</option>
                    {% endif %}
                    <option value="">-- Custom --</option>
                </select>
            </div>
        </div>
        <div class="family-actions">
            <button type="submit" class="btn-primary btn-sm">Save</button>
            <button type="button" class="btn-secondary btn-sm" onclick="window.location.reload()">
                Cancel
            </button>
        </div>
    </form>
</li>
