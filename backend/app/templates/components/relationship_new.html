<div class="relationship-form">
    <form hx-post="/ui/contacts/{{ contact.id }}/relationships" hx-target="#relationships-{{ contact.id }}"
        hx-swap="outerHTML">
        <div class="form-row">
            <div class="form-group">
                <label for="related_contact_id">Select Contact:</label>
                <select id="related_contact_id" name="related_contact_id" required>
                    <option value="">-- Select Contact --</option>
                    {% for c in available_contacts %}
                    <option value="{{ c.id }}">{{ c.first_name }}{% if c.last_name %} {{ c.last_name }}{% endif %}
                    </option>
                    {% endfor %}
                </select>
            </div>

            <div class="form-group">
                <label for="relationship">Relationship:</label>
                <select id="relationship" name="relationship" required>
                    <option value="">-- Select Relationship --</option>
                    {% for rel in common_relationships %}
                    <option value="{{ rel }}">{{ rel }}</option>
                    {% endfor %}
                </select>
            </div>
        </div>

        <div class="form-actions">
            <button type="submit" class="btn-primary">Add</button>
            <button type="button" class="btn-secondary" hx-get="/ui/contacts/{{ contact.id }}/relationships/cancel"
                hx-target="#relationship-form-container" hx-swap="innerHTML">
                Cancel
            </button>
        </div>
    </form>
</div>
