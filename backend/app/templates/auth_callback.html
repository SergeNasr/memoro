{% extends "base.html" %}

{% block title %}Logging in...{% endblock %}

{% block extra_head %}
<style>
    header {
        display: none;
    }
    body {
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        margin: 0;
    }
    main {
        max-width: none;
        padding: 0;
    }
</style>
{% endblock %}

{% block content %}
<p>Logging you in...</p>
{% endblock %}

{% block extra_scripts %}
<script>
    const hash = window.location.hash.substring(1);
    const params = new URLSearchParams(hash);
    const accessToken = params.get('access_token');

    if (accessToken) {
        window.location.href = `/auth/callback?access_token=${encodeURIComponent(accessToken)}`;
    } else {
        window.location.href = '/auth/login?error=no_token';
    }
</script>
{% endblock %}
