<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Logging in...</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
    </style>
</head>

<body>
    <p>Logging you in...</p>
    <script>
        const hash = window.location.hash.substring(1);
        const params = new URLSearchParams(hash);
        const queryParams = new URLSearchParams(window.location.search);

        // Clerk redirects with __clerk_created_session query parameter
        const clerkSession = queryParams.get('__clerk_created_session') || params.get('__clerk_created_session');

        if (clerkSession) {
            window.location.href = `/auth/callback?__clerk_created_session=${encodeURIComponent(clerkSession)}`;
        } else {
            window.location.href = '/auth/login?error=no_token';
        }
    </script>
</body>

</html>
